<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101610">
    <title>APEXthenics</title>
    
    <style>
        :root {
            --bg: #0c100d;
            --p: #151c16;
            --p2: #1b251c;
            --line: #2c3b2d;
            --gold: #d8b45b;
            --green: #8abf79;
            --text: #f0f2ec;
            --muted: #a3aea1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, Arial;
            padding-bottom: 80px;
        }

        .top {
            padding: 22px 18px;
            background: linear-gradient(135deg, #172219, #0d110e);
            border-bottom: 1px solid var(--line);
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--gold);
            font-weight: 800;
        }

        .brand {
            font-size: 27px;
            font-weight: 900;
            margin: 5px 0;
        }

        .brand span {
            color: var(--gold);
        }

        .sub, .muted {
            color: var(--muted);
        }

        .sub {
            font-size: 12px;
            letter-spacing: 1px;
        }

        .rankrow {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            gap: 10px;
        }

        .rankbadge {
            border: 1px solid #756332;
            border-radius: 8px;
            padding: 8px;
            color: var(--gold);
            font-size: 12px;
            font-weight: 800;
        }

        .tiny, .xp {
            font-size: 12px;
            color: var(--muted);
        }

        .bar {
            height: 6px;
            background: #293229;
            border-radius: 9px;
            margin-top: 10px;
            overflow: hidden;
        }

        .bar span {
            display: block;
            height: 100%;
            background: var(--gold);
            width: 0;
        }

        .wrap {
            max-width: 720px;
            margin: auto;
            padding: 16px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .sectionhead {
            display: flex;
            justify-content: space-between;
            align-items: end;
            margin: 8px 0 14px;
        }

        .sectionhead h2 {
            margin: 0;
            font-size: 22px;
        }

        .card {
            background: var(--p);
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 16px;
            margin-bottom: 13px;
        }

        .card h3 {
            margin: 0 0 8px;
            font-size: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .stat {
            background: var(--p2);
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--line);
        }

        .stat strong {
            display: block;
            font-size: 25px;
            color: var(--gold);
        }
